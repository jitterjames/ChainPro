name: Build ChainPro

on:
  push:
    branches: [ papaMaster, main, master ]
  pull_request:
    branches: [ papaMaster, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Build with Gradle
      run: ./gradlew clean build
    
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Build Windows Installer with Gradle
      run: ./gradlew jpackage
    
    - name: Upload Windows installer
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ChainPro-Windows-Installer
        path: build/dist/
